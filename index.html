<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080c08">
<title>SportsCast AI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080c08;--surface:#0f140f;--card:#141a14;--border:#1e2a1e;
  --green:#2dff7a;--green-dim:#1a9947;--amber:#ffb830;--red:#ff3d3d;
  --text:#e8f0e8;--muted:#5a7a5a;--gold:#d4a843;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:120px}
.header{background:rgba(8,12,8,0.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:22px 16px 14px}
.sticky-wrap{position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;color:var(--green);grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;margin-top:12px}.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;line-height:1}
.stat-val.green{color:var(--green)}.stat-val.amber{color:var(--amber)}.stat-val.red{color:var(--red)}
.stat-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:3px}
.section-header{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.section-header::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden;transition:transform 0.15s}
.card:active{transform:scale(0.98)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:12px 0 0 12px}
.card.high::before{background:var(--green)}.card.medium::before{background:var(--amber)}.card.low::before{background:var(--red)}
.card-sport{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--muted);margin-bottom:4px}
.card-winner{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--text);line-height:1.1;margin-bottom:10px}
.card-winner .odds{font-family:'DM Mono',monospace;font-size:14px;color:var(--gold);font-weight:400}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.conf-bar-wrap{flex:1;min-width:80px}
.conf-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:3px}
.conf-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.conf-fill{height:100%;border-radius:2px;transition:width 0.6s ease}
.conf-pct{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;min-width:44px;text-align:right}
.badge{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;padding:3px 7px;border-radius:20px;border:1px solid}
.badge.pending{color:var(--amber);border-color:var(--amber);background:rgba(255,184,48,0.08)}
.badge.correct{color:var(--green);border-color:var(--green);background:rgba(45,255,122,0.08)}
.badge.incorrect{color:var(--red);border-color:var(--red);background:rgba(255,61,61,0.08)}
.card-time{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-left:auto}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.flip-wrap{perspective:1000px;margin-bottom:10px;cursor:pointer}
.flip-inner{position:relative;transform-style:preserve-3d;transition:transform 0.45s cubic-bezier(0.4,0,0.2,1)}
.flip-inner.flipped{transform:rotateX(180deg)}
.flip-front,.flip-back{backface-visibility:hidden;-webkit-backface-visibility:hidden;width:100%}
.flip-front{position:relative}
.flip-back{position:absolute;top:0;left:0;transform:rotateX(180deg);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;min-height:100%}
.flip-back-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin-bottom:4px}
.flip-back-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.flip-back-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.compare-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.compare-col{background:rgba(255,255,255,0.03);border-radius:8px;padding:8px}
.compare-col.ew{border:1px solid rgba(50,200,100,0.25)}
.compare-col.win{border:1px solid rgba(255,180,0,0.25)}
.compare-head{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px;margin-bottom:6px;text-align:center}
.compare-row{display:flex;justify-content:space-between;font-size:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.compare-row span:first-child{color:var(--muted)}
.flip-back-stat{background:rgba(255,255,255,0.03);border-radius:6px;padding:6px;text-align:center}
.flip-back-stat-val{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:0.5px}
.flip-back-stat-label{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px}
.flip-back-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(30,42,30,0.4);font-size:10px}
.flip-back-key{color:var(--muted);font-family:'DM Mono',monospace}
.flip-back-val{font-family:'DM Mono',monospace;font-weight:500}
.flip-back-hint{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);text-align:center;margin-top:8px;letter-spacing:1px}
.odds-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:11px;margin-left:5px;cursor:pointer;vertical-align:middle}
.odds-modal-overlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:24px}
.odds-modal-overlay.open{display:flex}
.odds-modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:320px}
.odds-modal-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;margin-bottom:14px;text-align:center}
.odds-input-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px}
.odds-input{width:64px;text-align:center;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 6px;color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:20px}
.odds-slash{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--muted)}
.odds-result{text-align:center;padding:14px;background:rgba(50,200,100,0.08);border:1px solid rgba(50,200,100,0.25);border-radius:10px;margin-bottom:14px}
.odds-result-val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--green);letter-spacing:1px}
.odds-result-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.odds-implied{text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:14px}
.odds-close-btn{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;cursor:pointer}
.analytics-sheet{position:fixed;bottom:0;left:0;right:0;z-index:150;background:var(--surface);border-radius:16px 16px 0 0;border-top:1px solid var(--border);transform:translateY(calc(100% - 36px));transition:transform 0.35s cubic-bezier(0.4,0,0.2,1)}
.analytics-sheet.open{transform:translateY(0)}
.analytics-pill{display:flex;align-items:center;justify-content:center;height:36px;cursor:pointer;touch-action:none}
.analytics-pill-bar{width:36px;height:4px;background:var(--border);border-radius:2px;transition:background 0.2s}
.analytics-pill:active .analytics-pill-bar, .analytics-pill:hover .analytics-pill-bar{background:var(--green)}
.analytics-inner{padding:0 16px 140px;overflow-y:auto;max-height:75vh;-webkit-overflow-scrolling:touch}
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.analytics-section{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:10px 0 6px;border-top:1px solid var(--border);padding-top:8px}
.analytics-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(30,42,30,0.5)}
.analytics-key{font-family:'DM Mono',monospace;font-size:10px;color:var(--text)}
.analytics-val{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px}
.analytics-bar-wrap{flex:1;margin:0 8px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.analytics-bar-fill{height:100%;border-radius:2px;transition:width 0.6s ease}
.analytics-mini-stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center}
.analytics-mini-val{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px}
.analytics-mini-label{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.n-min{color:var(--muted);font-size:9px;margin-left:4px}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;margin-bottom:6px}
.empty-sub{font-size:13px;line-height:1.5}
.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:32px;color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;letter-spacing:1px}
.dot-pulse{display:flex;gap:4px}
.dot-pulse span{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.2s ease-in-out infinite}
.dot-pulse span:nth-child(2){animation-delay:0.2s}.dot-pulse span:nth-child(3){animation-delay:0.4s}
@keyframes pulse{0%,80%,100%{opacity:0.2}40%{opacity:1}}
.accuracy-card{background:linear-gradient(135deg,var(--card) 0%,rgba(45,255,122,0.05) 100%);border:1px solid var(--green-dim);border-radius:12px;padding:16px;margin-bottom:14px}
.accuracy-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--green);margin-bottom:10px}
.accuracy-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:13px}
.accuracy-row:last-child{border-bottom:none}
.accuracy-pct{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex;align-items:flex-end}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-height:70vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--green);margin-bottom:16px}
.input-group{margin-bottom:14px}
.input-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:6px;display:block}
.input-field{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;outline:none}
.input-field:focus{border-color:var(--green-dim)}
.save-btn{width:100%;background:var(--green);color:var(--bg);border:none;border-radius:10px;padding:14px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;margin-top:8px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,12,8,0.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:8px 0 20px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 0;transition:all 0.2s}
.nav-icon{font-size:20px}
.nav-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--muted)}
.nav-item.active .nav-label{color:var(--green)}
.setup-hint{background:rgba(212,168,67,0.1);border:1px solid var(--gold);border-radius:10px;padding:12px;font-size:13px;color:var(--gold);text-align:center;cursor:pointer}
</style>
</head>
<body>
<div class="sticky-wrap">
<div class="header">
  <div class="header-top">
    <div class="logo">Sports<span style="color:#ffffff">Cast</span></div>

  </div>
</div>
<div class="content" id="content">
  <div class="loading"><div class="dot-pulse"><span></span><span></span><span></span></div> LOADING</div>
</div>
<div class="analytics-sheet" id="analytics-sheet">
  <div class="analytics-pill" id="analytics-pill" onclick="toggleAnalytics()">
    <div class="analytics-pill-bar"></div>
  </div>
  <div class="analytics-inner" id="analytics-inner">
    <div style="color:var(--muted);font-family:monospace;font-size:10px;text-align:center;padding:12px">Loading analytics…</div>
  </div>
</div>
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('mlb',null,this)"><div class="nav-icon">⚾</div><div class="nav-label">MLB</div></div>
  <div class="nav-item" onclick="switchTab('racing',null,this)"><div class="nav-icon">🐎</div><div class="nav-label">RACING</div></div>
  <div class="nav-item" onclick="switchTab('accas',null,this)"><div class="nav-icon">🎯</div><div class="nav-label">PICKS</div></div>
  <div class="nav-item" onclick="switchTab('history',null,this)"><div class="nav-icon">📋</div><div class="nav-label">HISTORY</div></div>
  <div class="nav-item" onclick="switchTab('stats',null,this)"><div class="nav-icon">📊</div><div class="nav-label">STATS</div></div>
  <div class="nav-item" onclick="openConfig()"><div class="nav-icon">⚙️</div><div class="nav-label">SETUP</div></div>
</div>
<div class="modal-bg" id="modalBg" onclick="closeConfig(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Setup</div>
    <div class="input-group">
      <label class="input-label">GOOGLE SHEETS ID</label>
      <input class="input-field" id="sheetId" placeholder="Paste your Sheet ID here…">
    </div>
    <div class="input-group">
      <label class="input-label">GOOGLE SHEETS API KEY</label>
      <input class="input-field" id="apiKey" placeholder="AIza…">
      <div style="margin-top:6px;font-size:11px;color:var(--muted)">Get free at console.cloud.google.com → Credentials → API Key → restrict to Sheets API</div>
    </div>
    <button class="save-btn" onclick="saveConfig()">SAVE & LOAD</button>
  </div>
</div>
<script>
let SHEET_ID=localStorage.getItem('sc_sheet_id')||'';
let API_KEY=localStorage.getItem('sc_api_key')||'';
let currentTab='mlb';
let allData={mlb:[],racing:[],history:[],stats:{},bets:[]};

function saveConfig(){
  SHEET_ID=document.getElementById('sheetId').value.trim();
  API_KEY=document.getElementById('apiKey').value.trim();
  localStorage.setItem('sc_sheet_id',SHEET_ID);
  localStorage.setItem('sc_api_key',API_KEY);
  closeConfig();loadData();
}
function openConfig(){
  document.getElementById('sheetId').value=SHEET_ID;
  document.getElementById('apiKey').value=API_KEY;
  document.getElementById('modalBg').classList.add('open');
}
function closeConfig(e){if(!e||e.target===document.getElementById('modalBg'))document.getElementById('modalBg').classList.remove('open');}

async function fetchSheet(sheet,range){
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(sheet+'!'+range)}?key=${API_KEY}`;
  const r=await fetch(url);if(!r.ok)throw new Error(`Sheet error ${r.status}`);
  const d=await r.json();return d.values||[];
}

async function loadData(){
  if(!SHEET_ID||!API_KEY){renderSetupPrompt();return;}
  
  try{
    const[mlbRows,racingRows,historyRows,betsRows,accaRows,autoBetRows,autoBetCoverRows]=await Promise.all([
      fetchSheet('Daily Summary','A4:S200'),
      fetchSheet('Racing','A3:Z200'),
      // History/Bets/Accas/AutoBet/AutoBetCover are append-only logs that
      // grow every sweep — a fixed row cap WILL eventually be exceeded and
      // silently drop everything past it (this is what happened: History
      // hit its A5:M2000 cap, so only the row sitting right at 2000 showed
      // and every later entry — today's MLB games, other horses — never
      // got fetched at all). Open-ended ranges (no end row number) return
      // every row with data, so there's no cap left to hit.
      fetchSheet('History','A5:M'),
      fetchSheet('Bets','A2:I').catch(()=>[]),
      fetchSheet('Accas','A2:H').catch(()=>[]),
      fetchSheet('AutoBet','A2:K').catch(()=>[]),
      fetchSheet('AutoBetCover','A2:K').catch(()=>[]),
    ]);
    allData.bets=betsRows;
    allData.autoBets=(autoBetRows||[]).map(r=>({timestamp:r[0]||'',race:r[1]||'',ewHorse:r[2]||'',odds:r[3]||'',stakeEw:r[4]||'',totalOutlay:r[5]||'',valueRating:r[6]||'',edge:r[7]||'',confidence:r[8]||'',status:r[9]||'PENDING',wonOutright:r[10]||''}));
    allData.autoBetCovers=(autoBetCoverRows||[]).map(r=>({timestamp:r[0]||'',coverType:r[1]||'',bets:r[2]||0,legs:r[3]||'',lineStake:r[4]||'',totalOutlay:r[5]||'',status:r[6]||'PENDING',winReturn:r[7]||'',placeReturn:r[8]||'',totalReturn:r[9]||'',pnl:r[10]||''}));
    allData.accas=(accaRows||[]).map(r=>({date:r[0]||'',type:r[1]||'',legs:r[2]||'',odds:r[3]||'',returns:r[4]||'',conf:r[5]||'',combinedProb:r[6]||'',selections:(r[7]||'')}));
    allData.mlb=mlbRows.map(r=>({date:r[0]||'',sport:r[1]||'MLB',team:r[2]||'',opponent:r[3]||'',winner:r[4]||'',score:r[5]||'',aiConf:parseInt(r[6])||0,blended:parseInt(r[7])||0,actual:r[8]||'',result:r[9]||'PENDING',time:r[11]||'TBD',recommendation:r[12]||'',kellyStake:r[13]||'',fixedStake:r[14]||'',edge:r[15]||'',valueRating:r[16]||'',valueEdge:r[17]||'',valueEv:r[18]||''}));
    const _rawRacing=racingRows.map(r=>({date:r[0]||'',race:r[1]||'',winPick:r[2]||'',winOdds:r[3]||'',eachWay:r[4]||'',ewPlaceTerms:r[5]||'',aiConf:parseInt(r[6])||0,going:r[7]||'',ewResult:r[8]||'',ewRec:r[9]||'',winVsEwEv:r[10]||'',placeProb:r[11]||'',distance:r[12]||'',actual:r[13]||'',result:r[14]||'PENDING',time:r[15]||'',valueRating:r[16]||'',valueEdge:r[17]||'',valueEv:r[18]||'',kellyStake:r[19]||'',pickScore:parseFloat(r[20])||0,winProbability:r[21]||'',winOddsCol:r[22]||'',winEv:r[23]||'',winEdge:r[24]||'',simSource:r[25]||'',get winner(){return this.eachWay?this.eachWay.split(' at ')[0].split(' -')[0].split(',')[0].trim():this.winPick;},get odds(){return this.eachWay?this.eachWay.match(/at ([\d\/]+)/)?.[1]||this.winOdds:this.winOdds;}}));
  const _seenRacing=new Set();
  allData.racing=_rawRacing.filter(x=>{if(!x.winner||!x.race)return false;const k=x.race+'|'+x.winner;if(_seenRacing.has(k))return false;_seenRacing.add(k);return true;});
  //allData.racing=racingRows.map(r=>({date:r[0]||'',race:r[1]||'',winner:r[2]||'',odds:r[3]||'',eachWay:r[4]||'',ewPlaceTerms:r[5]||'',aiConf:parseInt(r[6])||0,going:r[7]||'',ewResult:r[8]||'',ewRec:r[9]||'',winVsEwEv:r[10]||'',placeProb:r[11]||'',distance:r[12]||'',actual:r[13]||'',result:r[14]||'PENDING',time:r[15]||''}));
    allData.history=historyRows.map(r=>({date:r[0]||'',sport:r[1]||'',team:r[2]||'',opponent:r[3]||'',winPick:r[4]||'',ewPick:r[5]||'',aiConf:parseInt(r[6])||0,actual:r[8]||'',result:r[9]||'PENDING',ewResult:r[11]||'',winResult:r[12]||'',get winner(){const ep=this.ewPick?this.ewPick.split(' at ')[0].trim():'';return this.sport==='RACING'&&ep&&ep.toLowerCase()!=='none'?ep:this.winPick;}}));
    const stats={};
    allData.history.forEach(p=>{
    const s=p.sport||'ALL';
    if(!stats[s])stats[s]={correct:0,incorrect:0,pending:0,placed:0,unplaced:0};
    if(s==='RACING'){
      // Win pick accuracy must come from the win pick's own outcome, not the
      // merged E/W result — racing has never written "CORRECT"/"INCORRECT"
      // (that's MLB-only), so the old check here could never fire for
      // racing at all. winResult (from column M) is the real source; for
      // rows predating that column, WIN PLACED/UNPLACED can be inferred
      // unambiguously from the legacy merged field, but plain PLACED cannot
      // (the old logic discarded whether a separate win pick also won) so
      // those rows are left uncounted rather than guessed.
      let winOutcome=p.winResult||'';
      if(!winOutcome){
        if(p.result==='WIN PLACED')winOutcome='WON';
        else if(p.result==='UNPLACED')winOutcome='LOST';
      }
      if(winOutcome==='WON')stats[s].correct++;
      else if(winOutcome==='LOST')stats[s].incorrect++;
      const ewOutcome=p.ewResult||(p.result==='PLACED'||p.result==='WIN PLACED'?'PLACED':p.result==='UNPLACED'?'UNPLACED':'');
      if(ewOutcome==='PLACED')stats[s].placed++;
      else if(ewOutcome==='UNPLACED')stats[s].unplaced++;
      else stats[s].pending++;
    }else{
      if(p.result==='CORRECT')stats[s].correct++;
      else if(p.result==='INCORRECT')stats[s].incorrect++;
      else stats[s].pending++;
    }
    if(!stats['ALL'])stats['ALL']={correct:0,incorrect:0,pending:0,placed:0,unplaced:0};
    if(s!=='ALL'){
      stats['ALL'].correct+=0; // ALL totals recomputed below from per-sport stats to avoid duplicating the branching logic
    }
  });
    // Roll up ALL from the per-sport totals now that RACING and non-RACING use different rules
    stats['ALL']={correct:0,incorrect:0,pending:0,placed:0,unplaced:0};
    Object.entries(stats).forEach(([sp,st])=>{
      if(sp==='ALL')return;
      stats['ALL'].correct+=st.correct;
      stats['ALL'].incorrect+=st.incorrect;
      stats['ALL'].pending+=st.pending;
      stats['ALL'].placed+=st.placed;
      stats['ALL'].unplaced+=st.unplaced;
    });
    allData.stats=stats;
    render();
  }catch(e){renderError(e.message);}
  finally{}
}

function calcPL(history){
  const pl={total:0,bets:0,byConf:{"70%+":{pl:0,bets:0},"45-70%":{pl:0,bets:0},"<45%":{pl:0,bets:0}},bySport:{}};
  history.forEach(p=>{
    if(p.result!=='CORRECT'&&p.result!=='INCORRECT')return;
    // Parse odds
    let decimal=2.0;
    const m=String(p.odds||'').match(/(\d+)\/(\d+)/);
    if(m)decimal=parseInt(m[1])/parseInt(m[2])+1;
    else if(/evs/i.test(p.odds||''))decimal=2.0;
    const profit=p.result==='CORRECT'?parseFloat((decimal-1).toFixed(2)):-1.0;
    pl.total+=profit;pl.bets++;
    // By sport
    const s=p.sport||'ALL';
    if(!pl.bySport[s])pl.bySport[s]={pl:0,bets:0};
    pl.bySport[s].pl+=profit;pl.bySport[s].bets++;
    // By confidence
    const cf=p.aiConf||0;
    const band=cf>=70?"70%+":cf>=45?"45-70%":"<45%";
    pl.byConf[band].pl+=profit;pl.byConf[band].bets++;
  });
  return pl;
}

function calcBetsPL(bets){
  // bets rows: date, sport, type, stake, legs, result, returns, pl, notes
  const res={total:0,bets:0,racing:{pl:0,bets:0,won:0,lost:0},mlb:{pl:0,bets:0,won:0,lost:0},other:{pl:0,bets:0,won:0,lost:0}};
  bets.forEach(r=>{
    const sport=(r[1]||'').toUpperCase();
    const pl=parseFloat((r[7]||'0').replace('£','').replace('+',''))||0;
    const result=(r[5]||'').toLowerCase();
    const key=sport==='RACING'?'racing':sport==='MLB'?'mlb':'other';
    res.total+=pl; res.bets++;
    res[key].pl+=pl; res[key].bets++;
    if(result==='won'||result==='placed') res[key].won++;
    else if(result==='lost') res[key].lost++;
  });
  return res;
}

    <div class="stat"><div class="stat-val" style="color:${oc}">${oa}%</div><div class="stat-label">ACCURACY</div></div>
    <div class="stat"><div class="stat-val" style="color:${plCol}">${bpl.total>=0?'+':''}£${bpl.total.toFixed(0)}</div><div class="stat-label">BET P&L</div></div>
    <div class="stat"><div class="stat-val" style="color:${plCol}">${roi>=0?'+':''}${roi.toFixed(0)}%</div><div class="stat-label">ROI</div></div>
  </div>`;

  // Auto-Bet Dry Run — simulated running bankroll, not real money.
  // Mirrors auto_bet.py's simulate_bankroll(): replays every SETTLED bet in
  // chronological order against a standalone bankroll starting at £5, paying
  // both win+place legs when wonOutright is confirmed TRUE, otherwise
  // falling back to place-side-only (conservative, for older entries settled
  // before that flag existed).
  const ab = allData.autoBets||[];
  if(ab.length){
    const STARTING_BANKROLL = 5.00;
    const parseMoney = v => parseFloat((v||'').replace('£',''))||0;
    const oddsToDec = s => { const m=(s||'').match(/(\d+)\/(\d+)/); return m?1+(parseInt(m[1])/parseInt(m[2])):0; };

    const abPending = ab.filter(b=>b.status==='PENDING');
    const sorted = [...ab].sort((a,b)=>(a.timestamp||'').localeCompare(b.timestamp||''));

    let bankroll = STARTING_BANKROLL;
    let settledCount = 0, placedCount = 0, unplacedCount = 0;
    sorted.forEach(b=>{
      if(b.status!=='PLACED'&&b.status!=='UNPLACED') return;
      settledCount++;
      const outlay = parseMoney(b.totalOutlay);
      const stakeEw = parseMoney(b.stakeEw);
      const dec = oddsToDec(b.odds);
      let change = -outlay;
      if(b.status==='PLACED'){
        placedCount++;
        const placeDec = dec>1 ? (dec-1)/5+1 : 0;
        if(b.wonOutright==='TRUE'){
          change += stakeEw*dec + stakeEw*placeDec; // both legs pay
        } else {
          change += stakeEw*placeDec; // place leg only (or unknown — conservative)
        }
      } else {
        unplacedCount++;
      }
      bankroll += change;
    });

    const pnl = bankroll - STARTING_BANKROLL;
    const pnlCol = pnl>=0?'var(--green)':'var(--red)';

    h+=`<div class="section-header" style="margin-top:16px">AUTO-BET DRY RUN <span style="color:var(--muted);font-size:9px">(SIMULATED — NOT REAL MONEY)</span></div>
    <div class="stat-bar">
      <div class="stat"><div class="stat-val">£${STARTING_BANKROLL.toFixed(2)}</div><div class="stat-label">STARTING</div></div>
      <div class="stat"><div class="stat-val" style="color:${pnlCol}">£${bankroll.toFixed(2)}</div><div class="stat-label">SIM BANKROLL NOW</div></div>
      <div class="stat"><div class="stat-val" style="color:${pnlCol}">${pnl>=0?'+':''}£${pnl.toFixed(2)}</div><div class="stat-label">TOTAL P&L</div></div>
    </div>
    <div style="font-size:10px;color:var(--muted);text-align:center;margin-top:-6px;margin-bottom:10px">
      ${ab.length} logged · ${abPending.length} pending · ${settledCount} settled (${placedCount} placed, ${unplacedCount} unplaced)<br>
      "What you'd have if you'd followed every auto-bet from £${STARTING_BANKROLL.toFixed(2)}"
    </div>`;

    // Individual bet cards — pending (what it WOULD bet) shown first, most
    // recent settled bets shown after for context. Same card style as the
    // existing Accas top-picks list, for visual consistency across tabs.
    const abStatusCol = s => s==='PLACED'?'var(--green)':s==='UNPLACED'?'var(--red)':'var(--amber)';
    const renderAbCard = b => {
      const col = abStatusCol(b.status);
      const stakeDisp = b.stakeEw||'';
      const won = b.wonOutright==='TRUE' ? ' <span style="color:var(--green);font-size:9px">WON OUTRIGHT</span>' : '';
      return `<div style="background:var(--card);border:1px solid var(--border);border-left:3px solid ${col};border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <div style="flex:1">
          <div style="font-size:10px;color:var(--muted);margin-bottom:3px">🐎 ${b.race||''} · ${b.timestamp||''}</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:18px">${b.ewHorse||''} @ ${b.odds||''}${won}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">${b.valueRating||''} ${b.edge||''} · ${b.confidence||''} conf · E/W ${stakeDisp}/line</div>
        </div>
        <div style="font-size:13px;font-family:'Bebas Neue',sans-serif;color:${col};margin-left:8px;text-align:right">${b.status||'PENDING'}</div>
      </div>`;
    };

    if(abPending.length){
      h+=`<div class="section-header" style="margin-top:12px">PENDING — WHAT IT WOULD BET NEXT</div>`;
      [...abPending].sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||'')).forEach(b=>{h+=renderAbCard(b);});
    }

    const abRecentSettled = [...ab].filter(b=>b.status==='PLACED'||b.status==='UNPLACED')
      .sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||'')).slice(0,10);
    if(abRecentSettled.length){
      h+=`<div class="section-header" style="margin-top:12px">RECENTLY SETTLED</div>`;
      abRecentSettled.forEach(b=>{h+=renderAbCard(b);});
    }
  }

  // Cover Bet Dry Run — only logged on days 3+ picks already cleared the
  // singles bar; a separate parallel ledger, not a replacement for the above.
  const acb = allData.autoBetCovers||[];
  if(acb.length){
    const parseMoney2 = v => parseFloat((v||'').replace('£',''))||0;
    const cbPending = acb.filter(c=>c.status==='PENDING');
    const cbSettled = acb.filter(c=>c.status==='SETTLED');
    const cbOutlay = cbSettled.reduce((s,c)=>s+parseMoney2(c.totalOutlay),0);
    const cbReturn = cbSettled.reduce((s,c)=>s+parseMoney2(c.totalReturn),0);
    const cbPnl = cbReturn - cbOutlay;
    const cbCol = cbPnl>=0?'var(--green)':'var(--red)';

    h+=`<div class="section-header" style="margin-top:16px">COVER BET DRY RUN <span style="color:var(--muted);font-size:9px">(SIMULATED — NOT REAL MONEY)</span></div>
    <div class="stat-bar">
      <div class="stat"><div class="stat-val">${acb.length}</div><div class="stat-label">LOGGED</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--amber)">${cbPending.length}</div><div class="stat-label">PENDING</div></div>
      <div class="stat"><div class="stat-val" style="color:${cbCol}">${cbPnl>=0?'+':''}£${cbPnl.toFixed(2)}</div><div class="stat-label">SETTLED P&L</div></div>
    </div>
    <div style="font-size:10px;color:var(--muted);text-align:center;margin-top:-6px;margin-bottom:10px">
      Only fires when 3+ picks already cleared the singles bar same day · compare against Auto-Bet above
    </div>`;

    const cbStatusCol = s => s==='SETTLED'?'var(--green)':'var(--amber)';
    [...acb].sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||'')).forEach(c=>{
      const col = cbStatusCol(c.status);
      const pnlLine = c.status==='SETTLED'
        ? `<div style="font-size:10px;color:${(parseMoney2(c.pnl)>=0)?'var(--green)':'var(--red)'};margin-top:2px">Return ${c.totalReturn||''} · P/L ${c.pnl||''}</div>`
        : '';
      h+=`<div style="background:var(--card);border:1px solid var(--border);border-left:3px solid ${col};border-radius:8px;padding:12px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:18px">${c.coverType||''}</div>
          <div style="font-size:13px;font-family:'Bebas Neue',sans-serif;color:${col}">${c.status||''}</div>
        </div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px">${c.legs||''}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px">${c.lineStake||''}/line · ${c.totalOutlay||''} total outlay</div>
        ${pnlLine}
      </div>`;
    });
  }

  return h;
}

function colourForPct(pct, baseline){
  if(!baseline) return pct >= 50 ? 'var(--green)' : pct >= 33 ? 'var(--amber)' : 'var(--red)';
  const diff = pct - baseline;
  return diff >= 10 ? 'var(--green)' : diff >= 0 ? 'var(--amber)' : 'var(--red)';
}

function analyticsRow(label, hits, total, pct, baseline, minN){
  if(total < (minN||3)) return `<div class="analytics-row"><span class="analytics-key">${label}</span><span class="n-min">${total} results (need ${minN||5}+)</span></div>`;
  const col = colourForPct(pct, baseline);
  const fillW = Math.round(pct);
  return `<div class="analytics-row">
    <span class="analytics-key">${label}</span>
    <div class="analytics-bar-wrap"><div class="analytics-bar-fill" style="width:${fillW}%;background:${col}"></div></div>
    <span class="analytics-val" style="color:${col}">${pct.toFixed(0)}%</span>
    <span class="n-min">${hits}/${total}</span>
  </div>`;
}

async function loadAnalytics(){
  if(!SHEET_ID||!API_KEY) return;
  try {
    const rows = await fetchSheet('Analytics','A1:E200');
    if(!rows||!rows.length){
      document.getElementById('analytics-inner').innerHTML =
        '<div style="color:var(--muted);font-family:monospace;font-size:10px;text-align:center;padding:12px">No analytics yet — run daily sweep</div>';
      return;
    }
    // Parse sheet rows into analyticsData structure
    analyticsData = parseAnalyticsSheet(rows);
    renderAnalyticsDrawer(analyticsData);
  } catch(e) {
    document.getElementById('analytics-inner').innerHTML =
      '<div style="color:var(--muted);font-family:monospace;font-size:10px;text-align:center;padding:12px">No analytics yet — run daily sweep</div>';

}

function parseAnalyticsSheet(rows){
  const data = {generated:'', ew:{total:0,placed:0,place_rate:0,by_value:{},by_conf:{},by_distance:{},by_going:{}}, mlb:{total:0,correct:0,accuracy:0,by_conf:{},by_value:{}}};
  let section = '';
  for(const row of rows){
    if(!row||!row[0]) continue;
    const key = (row[0]||'').trim();
    if(!key) continue;
    const val = parseFloat((row[1]||'').replace('%',''))||0;
    const counts = (row[2]||'');
    const parts = counts.split('/');
    const hits = parseInt(parts[0])||0;
    const total = parseInt(parts[1])||0;

    // Section headers
    if(key==='SPORTSCAST ANALYTICS'){ data.generated=row[1]||''; continue; }
    if(key==='MLB'){ section='mlb_summary'; data.mlb.accuracy=val; data.mlb.total=total||0; data.mlb.correct=hits||0; continue; }
    if(key==='RACING E/W'){ section='ew_summary'; data.ew.place_rate=val; data.ew.total=total||0; data.ew.placed=hits||0; continue; }
    if(key==='BY CONFIDENCE'){ section=section.startsWith('mlb')?'mlb_conf':'ew_conf'; continue; }
    if(key==='BY DISTANCE'){ section='ew_dist'; continue; }
    if(key==='BY GOING'){ section='ew_going'; continue; }

    const label = key.replace(/^\s+/,'');
    if(!label||!total) continue;

    if(section==='mlb_summary'||section==='mlb_conf'){
      data.mlb.by_conf[label]={pct:val,hits,total};
    } else if(section==='ew_summary'){
      data.ew.by_value[label]={pct:val,hits,total};
    } else if(section==='ew_conf'){
      data.ew.by_conf[label]={pct:val,hits,total};
    } else if(section==='ew_dist'){
      data.ew.by_distance[label]={pct:val,hits,total};
    } else if(section==='ew_going'){
      data.ew.by_going[label]={pct:val,hits,total};
    }
  }
  return data;
}

function openOddsConverter(num, den){
  const overlay = document.getElementById('odds-modal-overlay');
  const numInput = document.getElementById('odds-num');
  const denInput = document.getElementById('odds-den');
  numInput.value = num || '';
  denInput.value = den || '';
  overlay.classList.add('open');
  updateOddsResult();
  setTimeout(()=>numInput.focus(), 100);
}

function closeOddsConverter(e){
  if(e && e.target !== document.getElementById('odds-modal-overlay')) return;
  document.getElementById('odds-modal-overlay').classList.remove('open');
}

function updateOddsResult(){
  const num = parseFloat(document.getElementById('odds-num').value);
  const den = parseFloat(document.getElementById('odds-den').value);
  const resultEl = document.getElementById('odds-result-val');
  const impliedEl = document.getElementById('odds-implied');
  if(!num || !den || den===0){
    resultEl.textContent = '—';
    impliedEl.textContent = '';
    return;
  }
  const decimal = (num/den) + 1;
  const implied = (1/decimal)*100;
  resultEl.textContent = decimal.toFixed(3);
  impliedEl.textContent = `Implied win chance: ${implied.toFixed(1)}%`;
}

// ── Cover Bet Builder ───────────────────────────────────────────────────────
const COVER_BETS = {
  3: {name:'Patent',      bets:7,   desc:'3 singles, 3 doubles, 1 treble'},
  4: {name:'Lucky 15',    bets:15,  desc:'4 singles, 6 doubles, 4 trebles, 1 four-fold'},
  5: {name:'Lucky 31',    bets:31,  desc:'5 singles, 10 doubles, 10 trebles, 5 four-folds, 1 five-fold'},
  6: {name:'Lucky 63',    bets:63,  desc:'6 singles, 15 doubles, 20 trebles, 15 four-folds, 6 five-folds, 1 six-fold'},
  7: {name:'Super Heinz', bets:120, desc:'full cover on 7 selections'},
  8: {name:'Goliath',     bets:247, desc:'full cover on 8 selections'},
};

function buildCoverBetText(picks, label){
  const n = picks.length;
  const cb = COVER_BETS[Math.min(n,8)];
  // Plain selection names only — no confidence, ready to paste straight into a bet builder
  let text = picks.map(p=>p.name).join('\n');
  return {cb, text};
}

function copyToClipboard(text, btnEl){
  const done = ()=>{
    const orig = btnEl.textContent;
    btnEl.textContent = '✓ COPIED';
    setTimeout(()=>{ btnEl.textContent = orig; }, 1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{
      _fallbackCopy(text); done();
    });
  } else {
    _fallbackCopy(text); done();
  }
}

function _fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

function renderCoverBetSection(mlbPicks, racingPicks){
  const MIN_PICKS = 3;
  let h = '';

  const buildBlock = (picks, label, icon)=>{
    if(picks.length < MIN_PICKS) return '';
    const {cb, text} = buildCoverBetText(picks, label);
    const listId = 'coverbet_'+label.replace(/\s+/g,'_')+'_'+picks.length;
    const _safeText = text.replace(/'/g,"\\'").replace(/\n/g,'\\n');
    return `<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:17px">${icon} ${cb.name.toUpperCase()}</div>
        <div style="font-size:10px;color:var(--muted);font-family:'DM Mono',monospace">${cb.bets} BETS</div>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:10px">${picks.length} picks at 70%+ · ${label}</div>
      ${picks.map((p,i)=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(30,42,30,0.4);font-size:12px"><span>${i+1}. ${p.name}${p.sub?' <span style=\"color:var(--muted);font-size:10px\">('+p.sub+')</span>':''}</span><span style="color:var(--amber)">${p.conf}%</span></div>`).join('')}
      <button onclick="copyToClipboard('${_safeText}',this)" style="width:100%;margin-top:10px;background:var(--green);color:#000;border:none;border-radius:8px;padding:10px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;cursor:pointer">📋 COPY BET LIST</button>
    </div>`;
  };

  const blocks = [
    buildBlock(mlbPicks, 'MLB', '⚾'),
    buildBlock(racingPicks, 'RACING', '🐎'),
  ].filter(Boolean);

  if(!blocks.length) return '';

  h += '<div class="section-header" style="margin-top:16px">COVER BET BUILDER</div>';
  h += blocks.join('');
  return h;
}

function flipWrap(cardHtml, dataObj){

let _flippedCard = null;

function flipCard(el){
  const x = JSON.parse(decodeURIComponent(escape(atob(el.dataset.x||'e30='))));
  // Close any currently flipped card
  if(_flippedCard && _flippedCard !== el){
    const _prevInner = _flippedCard.querySelector('.flip-inner');
    const _prevFront  = _flippedCard.querySelector('.flip-front');
    _prevInner.classList.remove('flipped');
    setTimeout(()=>{ _prevInner.style.height = _prevFront.offsetHeight+'px'; }, 450);
    _flippedCard = null;
  }
  const inner = el.querySelector('.flip-inner');
  const front = el.querySelector('.flip-front');
  const back  = el.querySelector('.flip-back');
  const isFlipped = inner.classList.contains('flipped');

  if(isFlipped){
    inner.classList.remove('flipped');
    // Reset height back to the front face after the flip animation finishes
    setTimeout(()=>{ inner.style.height = front.offsetHeight+'px'; }, 450);
    _flippedCard = null;
    return;
  }

  // Build back content if not already built
  if(!back.dataset.built){
    back.innerHTML = buildFlipBack(x) + '<div class="flip-back-hint">TAP TO FLIP BACK</div>';
    back.dataset.built = '1';
  }
  // Match height to whichever face is taller while flipped open
  inner.style.height = Math.max(front.offsetHeight, back.offsetHeight)+'px';
  inner.classList.add('flipped');
  _flippedCard = el;
}

function buildFlipBack(x){
  const col = v => v>=70?'var(--green)':v>=45?'var(--amber)':'var(--red)';
  const vCol = v => v==='STRONG VALUE'||v==='VALUE'?'var(--green)':v==='MARGINAL'||v==='FAIR'?'var(--amber)':'var(--red)';
  const row = (k,v,c) => v?`<div class="flip-back-row"><span class="flip-back-key">${k}</span><span class="flip-back-val" style="color:${c||'var(--text)'}">${v}</span></div>`:'';
  let h = '';

  if(x.race||x.ewRec){
    // Racing
    const ewHorse = (x.eachWay||'').split(' at ')[0].trim()||x.winner||'';
    const ewOdds  = (x.eachWay||'').match(/at ([\d\/]+)/)?.[1]||'';
    const vrCol   = vCol(x.valueRating||'');
    const winEvNum = parseFloat((x.winEv||'').replace('£',''))||0;
    const ewEvNum  = parseFloat((x.valueEv||'').replace('£',''))||0;
    const winEvCol = winEvNum>0?'var(--green)':'var(--red)';
    const ewEvCol  = ewEvNum>0?'var(--green)':'var(--red)';
    h += `<div class="flip-back-title">${ewHorse}</div>`;
    h += `<div class="flip-back-sub">${x.race||''} · ${x.distance||''} · ${x.going||''}</div>`;

    // Side-by-side: Win pick vs E/W pick comparison
    h += `<div class="compare-wrap">
      <div class="compare-col win">
        <div class="compare-head" style="color:var(--amber)">WIN: ${x.winPick||'—'}</div>
        <div class="compare-row"><span>Probability</span><span>${x.winProbability||'—'}</span></div>
        <div class="compare-row"><span>Odds</span><span>${x.winOdds||'—'}</span></div>
        <div class="compare-row"><span>EV per £1</span><span style="color:${winEvCol}">${x.winEv||'—'}</span></div>
        <div class="compare-row"><span>Edge</span><span style="color:${winEvCol}">${x.winEdge||'—'}</span></div>
      </div>
      <div class="compare-col ew">
        <div class="compare-head" style="color:var(--green)">E/W: ${ewHorse}</div>
        <div class="compare-row"><span>Confidence</span><span>${x.pickScore>0?x.pickScore:x.aiConf}%</span></div>
        <div class="compare-row"><span>Odds</span><span>${ewOdds||'—'}</span></div>
        <div class="compare-row"><span>EV per £1</span><span style="color:${ewEvCol}">${x.valueEv||'—'}</span></div>
        <div class="compare-row"><span>Edge</span><span style="color:${ewEvCol}">${x.valueEdge||'—'}</span></div>
      </div>
    </div>`;

    h += `<div class="flip-back-grid">
      <div class="flip-back-stat"><div class="flip-back-stat-val" style="color:${vrCol}">${x.valueRating||'—'}</div><div class="flip-back-stat-label">VALUE RATING</div></div>
      <div class="flip-back-stat"><div class="flip-back-stat-val" style="color:var(--green)">${x.kellyStake||'—'}</div><div class="flip-back-stat-label">KELLY STAKE</div></div>
    </div>`;
    h += row('Place Terms', x.ewPlaceTerms||'', 'var(--text)');
    h += row('Runners', x.numRunners||'', 'var(--text)');
    if(x.pickScore>0) h += row('Pick Score', x.pickScore.toFixed(0)+'/100', x.pickScore>=72?'var(--green)':x.pickScore>=62?'var(--amber)':'var(--muted)');
    if(x.ew_trainer) h += row('Trainer', x.ew_trainer, 'var(--text)');
    if(x.ew_jockey)  h += row('Jockey', x.ew_jockey, 'var(--text)');
  } else {
    // MLB
    const vrCol = vCol(x.valueRating||'');
    h += `<div class="flip-back-title">${x.winner||''}</div>`;
    h += `<div class="flip-back-sub">${x.opponent||''} @ ${x.team||''}</div>`;
    h += `<div class="flip-back-grid">
      <div class="flip-back-stat"><div class="flip-back-stat-val" style="color:${col(x.blended||x.aiConf)}">${x.blended||x.aiConf}%</div><div class="flip-back-stat-label">CONFIDENCE</div></div>
      <div class="flip-back-stat"><div class="flip-back-stat-val" style="color:${vrCol}">${x.valueRating||'—'}</div><div class="flip-back-stat-label">VALUE</div></div>
      <div class="flip-back-stat"><div class="flip-back-stat-val" style="color:var(--amber)">${x.valueEdge||'—'}</div><div class="flip-back-stat-label">EDGE</div></div>
      <div class="flip-back-stat"><div class="flip-back-stat-val" style="color:${vrCol}">${x.valueEv||'—'}</div><div class="flip-back-stat-label">EV £1</div></div>
    </div>`;

    h += row('Win Probability', x.win_probability?x.win_probability+'%':'', col(x.win_probability));
    h += row('Form Rating', x.form_rating||'', 'var(--text)');
    h += row('Value Rating', x.valueRating||'', vrCol);
    h += row('Kelly Stake', x.kellyStake||'', 'var(--green)');
    h += row('Recommendation', x.recommendation||'', x.recommendation==='BET'?'var(--green)':'var(--muted)');
  }
  return h;
}

function render(){let h='';if(currentTab==='mlb')h=renderMLB();else if(currentTab==='racing')h=renderRacing();else if(currentTab==='history')h=renderHistory();else if(currentTab==='accas')h=renderAccas();else if(currentTab==='stats')h=renderStats();document.getElementById('content').innerHTML=h;}
function renderAccas(){
  if(!allData.accas||!allData.accas.length) return empty('🎯','NO ACCAS YET','Run the daily sweep to generate accumulators');

  // Compare against the REAL current date — the previous version just
  // trusted whatever date sat on the last row ever written to the sheet,
  // which silently showed stale accas (from whenever one was last actually
  // generated) as if they were today's, with no indication they were old.
  const realToday = new Date().toISOString().slice(0,10);
  const lastAccaRow = allData.accas[allData.accas.length-1];
  const lastAccaDate = (lastAccaRow.date||'').slice(0,10);
  const todayAccas = allData.accas.filter(a=>(a.date||'').slice(0,10)===realToday);
  if(!todayAccas.length){
    const msg = lastAccaDate
      ? `Most recent acca was generated ${lastAccaDate} — check back after today's sweep`
      : 'Run the daily sweep to generate accumulators';
    return empty('🎯','NO ACCA GENERATED TODAY', msg);
  }

  // Top picks from MLB and Racing
  const allPreds = [...allData.mlb,...allData.racing];
  const topPicks = allPreds.filter(x=>(x.blended||x.aiConf)>=55).sort((a,b)=>(b.blended||b.aiConf)-(a.blended||a.aiConf)).slice(0,6);

  let h = '<div class="section-header">TOP CONFIDENCE PICKS TODAY</div>';
  if(!topPicks.length) h += '<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">No picks above 55% confidence today</div>';
  topPicks.forEach((x,i)=>{
    const conf    = (x.sport==='RACING'&&x.pickScore>0)?x.pickScore:(x.blended||x.aiConf||0);
    const col     = conf>=70?'var(--green)':conf>=55?'var(--amber)':'var(--red)';
    const sport   = x.opponent?'⚾':'🐎';
    const name    = x.winner||'';
    const sub     = x.opponent?`${x.opponent} @ ${x.team}`:x.race||'';
    const vrating = x.valueRating||'';
    const vcol    = vrating==='STRONG VALUE'?'var(--green)':vrating==='VALUE'?'var(--amber)':'var(--muted)';
    const vbadge  = vrating?`<span style="font-size:8px;color:${vcol};border:1px solid ${vcol};border-radius:3px;padding:1px 4px;margin-left:6px">${vrating}</span>`:'';
    h+=`<div style="background:var(--card);border:1px solid var(--border);border-left:3px solid ${col};border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <div style="flex:1"><div style="font-size:10px;color:var(--muted);margin-bottom:3px">${sport} ${sub}</div><div style="font-family:'Bebas Neue',sans-serif;font-size:18px">${name}${vbadge}</div></div>
      <div style="font-size:22px;font-family:'Bebas Neue',sans-serif;color:${col};margin-left:8px">${conf}%</div>
    </div>`;
  });

  // Cover bet builder — 70%+ picks only, separate MLB/Racing lists
  const mlb70 = allData.mlb.filter(x=>(x.blended||x.aiConf||0)>=70).sort((a,b)=>(b.blended||b.aiConf)-(a.blended||a.aiConf))
    .map(x=>({name:x.winner||'',sub:x.opponent?`vs ${x.opponent}`:'',conf:x.blended||x.aiConf||0}));
  const racing70 = allData.racing.filter(x=>{const c=(x.pickScore>0?x.pickScore:(x.blended||x.aiConf||0));return c>=70&&x.ewRec!=='SKIP';})
    .sort((a,b)=>(b.pickScore>0?b.pickScore:(b.blended||b.aiConf))-(a.pickScore>0?a.pickScore:(a.blended||a.aiConf)))
    .map(x=>({name:x.winner||'',sub:x.race||'',conf:Math.round(x.pickScore>0?x.pickScore:(x.blended||x.aiConf||0))}));
  h += renderCoverBetSection(mlb70, racing70);

  h += '<div class="section-header" style="margin-top:16px">SUGGESTED ACCUMULATORS</div>';
  const typeEmoji = {MLB:'⚾',RACING:'🐎',MIXED:'🎯'};
  const uniqueAccas=todayAccas.reduceRight((acc,a)=>{if(!acc.find(b=>b.type===a.type))acc.push(a);return acc;},[]).reverse().slice(0,3);
  uniqueAccas.forEach(a=>{
    const emoji = typeEmoji[a.type]||'🎯';
    const conf  = parseFloat(a.conf)||0;
    const col   = conf>=60?'var(--green)':conf>=45?'var(--amber)':'var(--red)';
    const sels  = a.selections.split(' | ');
    h+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:20px">${emoji} ${a.type} ACCA</div>
        <div style="text-align:right"><div style="font-size:10px;color:var(--muted)">COMBINED ODDS</div><div style="font-size:18px;font-family:'Bebas Neue',sans-serif;color:var(--amber)">${a.odds}:1</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:10px">
        <div style="background:rgba(255,255,255,0.03);border-radius:6px;padding:8px;text-align:center">
          <div style="font-size:9px;color:var(--muted);letter-spacing:1px">LEGS</div>
          <div style="font-size:20px;font-family:'Bebas Neue',sans-serif">${a.legs}</div>
        </div>
        <div style="background:rgba(255,255,255,0.03);border-radius:6px;padding:8px;text-align:center">
          <div style="font-size:9px;color:var(--muted);letter-spacing:1px">£1 RETURNS</div>
          <div style="font-size:20px;font-family:'Bebas Neue',sans-serif;color:var(--green)">${a.returns}</div>
        </div>
        <div style="background:rgba(255,255,255,0.03);border-radius:6px;padding:8px;text-align:center">
          <div style="font-size:9px;color:var(--muted);letter-spacing:1px">AVG CONF</div>
          <div style="font-size:20px;font-family:'Bebas Neue',sans-serif;color:${col}">${a.conf}</div>
        </div>
        <div style="background:rgba(255,255,255,0.03);border-radius:6px;padding:8px;text-align:center">
          <div style="font-size:9px;color:var(--muted);letter-spacing:1px">ACCA PROB</div>
          <div style="font-size:20px;font-family:'Bebas Neue',sans-serif;color:${parseFloat(a.combinedProb)>=20?'var(--green)':parseFloat(a.combinedProb)>=10?'var(--amber)':'var(--red)'}">${a.combinedProb||'—'}</div>
        </div>
      </div>
      <div style="font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:6px">SELECTIONS</div>
      ${sels.map((s,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)"><span style="color:var(--green);font-size:12px">${i+1}.</span><span style="font-size:13px">${s}</span></div>`).join('')}
    </div>`;
  });
  return h;
}

function switchTab(tab,el,nav){
  currentTab=tab;
  document.querySelectorAll('.nav-item').forEach(t=>t.classList.remove('active'));
  if(nav)nav.classList.add('active');
  render();
}
if(SHEET_ID&&API_KEY)loadData();else renderSetupPrompt(); loadAnalytics(); initSheetSwipe();
</script>
